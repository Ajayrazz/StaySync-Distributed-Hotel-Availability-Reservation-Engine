services:
  # PostgreSQL with PostGIS extension for Geospatial queries & Date exclusion constraints
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: staysync-postgres
    environment:
      POSTGRES_DB: staysync_db
      POSTGRES_USER: staysync_user
      POSTGRES_PASSWORD: staysync_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staysync_user -d staysync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Distributed Caching, 15-Minute Cart Reservation Holds, & Redisson Distributed Locks
  redis:
    image: redis:7.2-alpine
    container_name: staysync-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka (KRaft mode - no Zookeeper required) for Event-Driven Messaging
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: staysync-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/tmp/kraft-broker-logs

  # Prometheus for monitoring metrics from Spring Boot Actuator
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: staysync-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  postgres_data:
  redis_data:
  kafka_data:
